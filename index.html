<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
    <title>Dream Josh · All-in-One PDF Tools</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js"></script>
    <style>
        :root {
            --bg-color: #f5f7fb;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --primary-blue: #2563eb;
            --secondary-blue: #3b82f6;
            --success-green: #10b981;
            --warning-red: #ef4444;
            --border-color: #e2e8f0;
            --shadow-color: rgba(0, 0, 0, 0.06);
            --text-light: #64748b;
            --studio-accent: #8b5cf6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
        }

        /* ========== VIEWS ========== */
        .view { display: none; min-height: 100vh; }
        .view.active { display: block; }

        /* ========== HOME PAGE ========== */
        .home-container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 40px 24px;
        }
        .page-header { margin-bottom: 32px; }
        .page-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 6px;
        }
        .page-header h1 span { color: var(--primary-blue); }
        .page-header p { font-size: 15px; color: var(--text-light); }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* ========== TOOL CARD (CENTERED CONTENT) ========== */
        .tool-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 28px 22px;
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 3px var(--shadow-color);
            transition: all 0.25s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 12px;
            position: relative;
            min-height: 180px;
        }
        .tool-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
            border-color: var(--secondary-blue);
        }

        .tool-card .card-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            flex-shrink: 0;
        }

        .tool-card h3 {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.3;
            color: var(--text-color);
        }

        .tool-card .card-desc {
            font-size: 12px;
            color: var(--text-light);
            line-height: 1.5;
            display: none;
        }

        .tool-card .badge {
            position: absolute;
            top: 14px;
            right: 14px;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }
        .badge.free { background: #ecfdf5; color: #10b981; }
        .badge.pro { background: #f5f3ff; color: #8b5cf6; }
        .badge.new { background: #fffbeb; color: #f59e0b; }

        /* Icon colors */
        .icon-red { background: #fef2f2; color: #ef4444; }
        .icon-orange { background: #fff7ed; color: #f97316; }
        .icon-green { background: #f0fdf4; color: #22c55e; }
        .icon-blue { background: #eff6ff; color: #3b82f6; }
        .icon-purple { background: #faf5ff; color: #9333ea; }
        .icon-yellow { background: #fffbeb; color: #eab308; }
        .icon-indigo { background: #eef2ff; color: #6366f1; }
        .icon-pink { background: #fdf2f8; color: #ec4899; }

        /* ========== TOOL PAGE ========== */
        .tool-page {
            min-height: 100vh;
            background: var(--bg-color);
        }
        .tool-page-header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 3px var(--shadow-color);
        }
        .back-btn {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 18px; border: 2px solid var(--border-color);
            border-radius: 10px; background: var(--bg-color);
            color: var(--text-color); font-weight: 600; font-size: 14px;
            cursor: pointer; transition: 0.2s;
        }
        .back-btn:hover { border-color: var(--secondary-blue); background: #eff6ff; }
        .tool-page-header h2 {
            font-size: 20px; font-weight: 700; color: var(--text-color);
            display: flex; align-items: center; gap: 10px;
        }
        .tool-page-header h2 i { color: var(--primary-blue); }

        .tool-page-content {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }
        .tool-panel {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 36px 40px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
        }

        .form-group { margin-bottom: 22px; }
        .form-group label {
            display: block; font-weight: 600; font-size: 14px;
            margin-bottom: 8px; color: var(--text-color);
        }
        .form-group input[type="text"],
        .form-group input[type="url"],
        .form-group input[type="number"],
        .form-group input[type="password"],
        .form-group textarea,
        .form-group select {
            width: 100%; padding: 14px 18px;
            border: 2px solid var(--border-color);
            border-radius: 12px; font-size: 15px;
            background: #f8fafc; color: var(--text-color);
            transition: 0.2s; font-family: inherit;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: var(--studio-accent); outline: none;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
        }
        .form-group textarea { min-height: 100px; resize: vertical; }

        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 16px; padding: 48px 24px;
            text-align: center; cursor: pointer;
            transition: 0.2s; background: #f8fafc;
        }
        .upload-area:hover { border-color: var(--studio-accent); background: #faf5ff; }
        .upload-area i { font-size: 48px; color: var(--studio-accent); margin-bottom: 14px; }
        .upload-area p { color: var(--text-light); font-size: 14px; }
        .upload-area .file-name-display {
            font-weight: 600; color: var(--primary-blue);
            margin-top: 10px; font-size: 14px;
        }

        .preview-box {
            background: #f8fafc; border: 2px solid var(--border-color);
            border-radius: 16px; padding: 24px; margin-top: 16px;
            min-height: 80px; font-size: 14px; line-height: 1.7;
            max-height: 300px; overflow-y: auto;
        }
        .preview-box img { max-width: 100%; height: auto; border-radius: 8px; }

        .action-row {
            display: flex; flex-wrap: wrap; gap: 14px;
            margin-top: 28px; padding-top: 28px;
            border-top: 2px solid var(--border-color);
        }
        .action-row button {
            padding: 14px 32px; border: none; border-radius: 40px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: 0.2s; min-height: 50px;
            display: flex; align-items: center; gap: 10px;
            background: var(--secondary-blue); color: #fff;
        }
        .action-row button:hover { transform: scale(1.03); }
        .action-row .btn-primary { background: var(--primary-blue); }
        .action-row .btn-primary:hover { box-shadow: 0 8px 25px rgba(37, 99, 235, 0.35); }
        .action-row .btn-success { background: linear-gradient(135deg, #10b981, #059669); }
        .action-row .btn-success:hover { box-shadow: 0 8px 25px rgba(16, 185, 129, 0.35); }
        .action-row .btn-danger { background: #ef4444; }
        .action-row .btn-danger:hover { box-shadow: 0 8px 25px rgba(239, 68, 68, 0.35); }

        .inline-row {
            display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
            margin-bottom: 16px;
        }
        .inline-row label {
            font-size: 14px; font-weight: 600; min-width: 100px;
        }
        .inline-row input[type="text"],
        .inline-row input[type="number"],
        .inline-row select {
            flex: 1; padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 10px; background: #f8fafc; font-size: 14px;
        }
        .inline-row input[type="range"] { flex: 1; accent-color: var(--secondary-blue); }

        .toast {
            position: fixed; bottom: 40px; left: 50%;
            transform: translateX(-50%);
            padding: 14px 28px; border-radius: 14px;
            color: white; font-size: 14px; font-weight: 600;
            z-index: 9999; box-shadow: 0 10px 40px rgba(0,0,0,0.25);
            max-width: 90%; text-align: center;
            animation: toastIn 0.3s ease;
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .toast.success { background: #10b981; }
        .toast.error { background: #ef4444; }
        .toast.info { background: #3b82f6; }

        .hidden-input { display: none; }

        .progress-bar {
            width: 100%; height: 8px; background: var(--border-color);
            border-radius: 4px; margin: 16px 0; overflow: hidden; display: none;
        }
        .progress-bar .progress-fill {
            height: 100%; background: var(--secondary-blue);
            width: 0%; transition: width 0.3s ease; border-radius: 4px;
        }
        .status-text {
            font-size: 14px; color: var(--text-light);
            margin-top: 12px; display: none;
        }
        .status-text.show { display: block; }
        .status-text .spinner { display: inline-block; animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .info-note {
            background: #eff6ff; border: 1px solid #bfdbfe;
            border-radius: 12px; padding: 14px 18px;
            font-size: 13px; color: #1e40af;
            margin-top: 16px; display: flex; gap: 10px; align-items: flex-start;
        }
        .info-note i { margin-top: 2px; }

        @media (max-width: 768px) {
            .home-container { padding: 24px 16px; }
            .tools-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
            .tool-card { padding: 20px 14px; min-height: 150px; gap: 10px; }
            .tool-card .card-icon { width: 48px; height: 48px; font-size: 22px; }
            .tool-card h3 { font-size: 13px; }
            .tool-panel { padding: 24px 20px; }
            .tool-page-header { padding: 12px 16px; }
            .tool-page-header h2 { font-size: 16px; }
            .action-row button { padding: 12px 22px; font-size: 14px; }
        }
    </style>
</head>
<body>

<!-- ================= HOME VIEW ================= -->
<div class="view active" id="homeView">
    <div class="home-container">
        <div class="page-header">
            <h1>🛠️ <span>Dream Josh</span> · All-in-One PDF Tools</h1>
            <p>Every tool you need to work with PDFs in one place — 100% free, local processing.</p>
        </div>
        <div class="tools-grid" id="toolsGrid"></div>
    </div>
</div>

<!-- ================= TOOL VIEW ================= -->
<div class="view" id="toolView">
    <div class="tool-page">
        <div class="tool-page-header">
            <button class="back-btn" onclick="goHome()"><i class="fas fa-arrow-left"></i> Back</button>
            <h2 id="toolPageTitle"><i class="fas fa-file-pdf"></i> Tool</h2>
        </div>
        <div class="tool-page-content">
            <div class="tool-panel" id="toolPanel"></div>
        </div>
    </div>
</div>

<script>
// ============================================================
// TOOLS DATA
// ============================================================
const TOOLS = [
    { id: 'merge-pdf', name: 'Merge PDF', icon: 'fa-object-group', iconClass: 'icon-red', badge: null,
      desc: 'Combine PDFs in the order you want.' },
    { id: 'split-pdf', name: 'Split PDF', icon: 'fa-cut', iconClass: 'icon-orange', badge: null,
      desc: 'Separate one page or a whole set.' },
    { id: 'compress-pdf', name: 'Compress PDF', icon: 'fa-compress-alt', iconClass: 'icon-green', badge: null,
      desc: 'Reduce file size while optimizing quality.' },
    { id: 'pdf-to-word', name: 'PDF to Word', icon: 'fa-file-word', iconClass: 'icon-blue', badge: null,
      desc: 'Convert PDF to editable DOC/DOCX.' },
    { id: 'pdf-to-ppt', name: 'PDF to PowerPoint', icon: 'fa-file-powerpoint', iconClass: 'icon-red', badge: null,
      desc: 'Turn PDF into editable PPT slideshows.' },
    { id: 'pdf-to-excel', name: 'PDF to Excel', icon: 'fa-file-excel', iconClass: 'icon-green', badge: null,
      desc: 'Pull data from PDF into Excel sheets.' },
    { id: 'word-to-pdf', name: 'Word to PDF', icon: 'fa-file-word', iconClass: 'icon-blue', badge: null,
      desc: 'Make DOC/DOCX easy to read as PDF.' },
    { id: 'ppt-to-pdf', name: 'PowerPoint to PDF', icon: 'fa-file-powerpoint', iconClass: 'icon-red', badge: null,
      desc: 'Make PPT/PPTX easy to view as PDF.' },
    { id: 'excel-to-pdf', name: 'Excel to PDF', icon: 'fa-file-excel', iconClass: 'icon-green', badge: null,
      desc: 'Make EXCEL spreadsheets easy to read.' },
    { id: 'edit-pdf', name: 'Edit PDF', icon: 'fa-edit', iconClass: 'icon-purple', badge: null,
      desc: 'Add text, images, shapes, annotations.' },
    { id: 'pdf-to-jpg', name: 'PDF to JPG', icon: 'fa-file-image', iconClass: 'icon-yellow', badge: null,
      desc: 'Convert each page to JPG or extract images.' },
    { id: 'jpg-to-pdf', name: 'JPG to PDF', icon: 'fa-file-image', iconClass: 'icon-yellow', badge: null,
      desc: 'Convert JPG images to PDF in seconds.' },
    { id: 'sign-pdf', name: 'Sign PDF', icon: 'fa-signature', iconClass: 'icon-blue', badge: null,
      desc: 'Sign yourself or request signatures.' },
    { id: 'watermark-pdf', name: 'Watermark', icon: 'fa-tint', iconClass: 'icon-purple', badge: null,
      desc: 'Stamp an image or text over your PDF.' },
    { id: 'rotate-pdf', name: 'Rotate PDF', icon: 'fa-sync-alt', iconClass: 'icon-purple', badge: null,
      desc: 'Rotate your PDFs the way you need them.' },
    { id: 'html-to-pdf', name: 'HTML to PDF', icon: 'fa-code', iconClass: 'icon-yellow', badge: null,
      desc: 'Convert webpages in HTML to PDF.' },
    { id: 'unlock-pdf', name: 'Unlock PDF', icon: 'fa-unlock', iconClass: 'icon-blue', badge: null,
      desc: 'Remove PDF password security.' },
    { id: 'protect-pdf', name: 'Protect PDF', icon: 'fa-lock', iconClass: 'icon-blue', badge: null,
      desc: 'Protect PDF files with a password.' },
    { id: 'organize-pdf', name: 'Organize PDF', icon: 'fa-sitemap', iconClass: 'icon-red', badge: null,
      desc: 'Sort, delete and add PDF pages.' },
    { id: 'pdf-to-pdfa', name: 'PDF to PDF/A', icon: 'fa-file-pdf', iconClass: 'icon-blue', badge: null,
      desc: 'Transform PDF to ISO-standard PDF/A.' },
    { id: 'repair-pdf', name: 'Repair PDF', icon: 'fa-wrench', iconClass: 'icon-green', badge: null,
      desc: 'Repair damaged PDF and recover data.' },
    { id: 'add-page-numbers', name: 'Page numbers', icon: 'fa-list-ol', iconClass: 'icon-purple', badge: null,
      desc: 'Add page numbers into PDFs with ease.' },
    { id: 'scan-to-pdf', name: 'Scan to PDF', icon: 'fa-camera', iconClass: 'icon-red', badge: null,
      desc: 'Capture document scans from your device.' },
    { id: 'ocr-pdf', name: 'OCR PDF', icon: 'fa-eye', iconClass: 'icon-green', badge: null,
      desc: 'Convert scanned PDF into searchable text.' },
    { id: 'compare-pdf', name: 'Compare PDF', icon: 'fa-columns', iconClass: 'icon-blue', badge: null,
      desc: 'Side-by-side comparison of PDF versions.' },
    { id: 'redact-pdf', name: 'Redact PDF', icon: 'fa-eraser', iconClass: 'icon-red', badge: null,
      desc: 'Remove sensitive information permanently.' },
    { id: 'crop-pdf', name: 'Crop PDF', icon: 'fa-crop-alt', iconClass: 'icon-purple', badge: null,
      desc: 'Crop margins or select specific areas.' },
    { id: 'pdf-forms', name: 'PDF Forms', icon: 'fa-wpforms', iconClass: 'icon-indigo', badge: 'New',
      desc: 'Detect form fields, create fillable PDFs.' },
    { id: 'ai-summarizer', name: 'AI Summarizer', icon: 'fa-robot', iconClass: 'icon-purple', badge: 'New',
      desc: 'Generate concise summaries from text.' },
    { id: 'translate-pdf', name: 'Translate PDF', icon: 'fa-language', iconClass: 'icon-purple', badge: 'New',
      desc: 'Translate PDF files powered by AI.' },
    { id: 'pdf-to-markdown', name: 'PDF to Markdown', icon: 'fa-markdown', iconClass: 'icon-purple', badge: 'New',
      desc: 'Turn PDFs into Markdown files.' }
];

// ============================================================
// RENDER HOME GRID (CENTERED)
// ============================================================
function renderHome() {
    const grid = document.getElementById('toolsGrid');
    grid.innerHTML = TOOLS.map(tool => {
        const badgeHtml = tool.badge ? `<span class="badge ${tool.badge.toLowerCase()}">${tool.badge}</span>` : '';
        return `
            <div class="tool-card" onclick="openTool('${tool.id}')">
                ${badgeHtml}
                <div class="card-icon ${tool.iconClass}"><i class="fas ${tool.icon}"></i></div>
                <h3>${tool.name}</h3>
            </div>
        `;
    }).join('');
}

// ============================================================
// NAVIGATION
// ============================================================
function openTool(toolId) {
    const tool = TOOLS.find(t => t.id === toolId);
    if (!tool) return;
    document.getElementById('toolPageTitle').innerHTML = `<i class="fas ${tool.icon}"></i> ${tool.name}`;
    document.getElementById('toolPanel').innerHTML = getToolHTML(toolId);
    document.getElementById('homeView').classList.remove('active');
    document.getElementById('toolView').classList.add('active');
    window.scrollTo(0, 0);
    if (toolId === 'watermark-pdf') {
        const slider = document.getElementById('wmOpacity');
        if (slider) slider.addEventListener('input', e => document.getElementById('wmOpacityVal').textContent = e.target.value);
    }
}

function goHome() {
    document.getElementById('toolView').classList.remove('active');
    document.getElementById('homeView').classList.add('active');
    window.scrollTo(0, 0);
}

// ============================================================
// TOOL HTML GENERATOR
// ============================================================
function getToolHTML(id) {
    const map = {
        'merge-pdf': `
            <div class="form-group"><label>Upload PDF files (multiple, in order)</label>
            <div class="upload-area" onclick="document.getElementById('mergeInput').click()">
            <i class="fas fa-file-pdf"></i><p>Click to select multiple PDF files</p>
            <div class="file-name-display" id="mergeFileName">No files selected</div>
            <input type="file" id="mergeInput" accept=".pdf" multiple class="hidden-input" onchange="handleMergeFiles(event)"></div></div>
            <div id="mergePreview" class="preview-box"><p style="color:var(--text-light);">Selected files will appear here.</p></div>
            <div class="action-row"><button class="btn-success" onclick="mergePdfs()"><i class="fas fa-object-group"></i> Merge PDFs</button>
            <button class="btn-danger" onclick="clearMerge()"><i class="fas fa-trash"></i> Clear</button></div>
        `,
        'split-pdf': `
            <div class="form-group"><label>Upload PDF</label>
            <div class="upload-area" onclick="document.getElementById('splitInput').click()">
            <i class="fas fa-file-pdf"></i><p>Click to select a PDF file</p>
            <div class="file-name-display" id="splitFileName">No file selected</div>
            <input type="file" id="splitInput" accept=".pdf" class="hidden-input" onchange="handleSplitFile(event)"></div></div>
            <div class="form-group"><label>Split mode</label>
            <select id="splitMode" onchange="toggleSplitMode()">
            <option value="each">Split every page into separate file</option>
            <option value="range">Split by page ranges</option></select></div>
            <div id="splitRangeGroup" style="display:none;">
            <div class="inline-row"><label>Page ranges</label>
            <input type="text" id="splitRange" placeholder="e.g., 1-3,5,7-9"></div></div>
            <div class="action-row"><button class="btn-success" onclick="splitPdf()"><i class="fas fa-cut"></i> Split PDF</button>
            <button class="btn-danger" onclick="clearSplit()"><i class="fas fa-trash"></i> Clear</button></div>
        `,
        'compress-pdf': `
            <div class="form-group"><label>Upload PDF</label>
            <div class="upload-area" onclick="document.getElementById('compressInput').click()">
            <i class="fas fa-file-pdf"></i><p>Click to select a PDF file</p>
            <div class="file-name-display" id="compressFileName">No file selected</div>
            <input type="file" id="compressInput" accept=".pdf" class="hidden-input" onchange="handleCompressFile(event)"></div></div>
            <div class="form-group"><label>Compression quality</label>
            <select id="compressQuality"><option value="0.8">High (larger file)</option>
            <option value="0.5" selected>Medium (recommended)</option><option value="0.2">Low (smallest file)</option></select></div>
            <div class="action-row"><button class="btn-success" onclick="compressPdf()"><i class="fas fa-compress-alt"></i> Compress PDF</button>
            <button class="btn-danger" onclick="clearCompress()"><i class="fas fa-trash"></i> Clear</button></div>
        `,
        'pdf-to-word': `
            <div class="form-group"><label>Upload PDF</label>
            <div class="upload-area" onclick="document.getElementById('pdfWordInput').click()">
            <i class="fas fa-file-pdf"></i><p>Click to select a PDF file</p>
            <div class="file-name-display" id="pdfWordFileName">No file selected</div>
            <input type="file" id="pdfWordInput" accept=".pdf" class="hidden-input" onchange="handlePdfWordFile(event)"></div></div>

// ============================================================
// TOAST
// ============================================================
function showToast(msg, type = 'info') {
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s';
        setTimeout(() => t.remove(), 300); }, 3000);
}

// ---------- MERGE ----------
function handleMergeFiles(e) {
    files.merge = Array.from(e.target.files);
    document.getElementById('mergeFileName').textContent = files.merge.length + ' file(s) selected';
    document.getElementById('mergePreview').innerHTML = files.merge.map(f =>
        `<div style="display:inline-block;margin:4px;padding:6px 12px;background:#f1f5f9;border-radius:8px;font-size:13px;"><i class="fas fa-file-pdf" style="color:#ef4444;"></i> ${f.name}</div>`).join('');
}
async function mergePdfs() {
    if (files.merge.length < 2) { showToast('Please select at least two PDF files.', 'error'); return; }
    try {
        const { PDFDocument } = PDFLib;
        const merged = await PDFDocument.create();
        for (const f of files.merge) {
            const buf = await f.arrayBuffer();
            const pdf = await PDFDocument.load(buf);
            const pages = await merged.copyPages(pdf, pdf.getPageIndices());
            pages.forEach(p => merged.addPage(p));
        }
        const bytes = await merged.save();
        saveAs(new Blob([bytes], { type: 'application/pdf' }), 'merged.pdf');
        showToast('✅ PDFs merged successfully!', 'success');
    } catch (err) { showToast('Error: ' + err.message, 'error'); }
}
function clearMerge() {
    files.merge = [];
    document.getElementById('mergeFileName').textContent = 'No files selected';
    document.getElementById('mergePreview').innerHTML = '<p style="color:var(--text-light);">Selected files will appear here.</p>';
    document.getElementById('mergeInput').value = '';
}

// ---------- SPLIT ----------
function handleSplitFile(e) { files.split = e.target.files[0]; document.getElementById('splitFileName').textContent = files.split ? files.split.name : 'No file selected'; }
function toggleSplitMode() { document.getElementById('splitRangeGroup').style.display = document.getElementById('splitMode').value === 'range' ? 'block' : 'none'; }
async function splitPdf() {
    if (!files.split) { showToast('Please select a PDF.', 'error'); return; }
    const mode = document.getElementById('splitMode').value;
    try {
        const { PDFDocument } = PDFLib;
        const buf = await files.split.arrayBuffer();
        const pdf = await PDFDocument.load(buf);
        const total = pdf.getPageCount();
        if (mode === 'each') {
            for (let i = 0; i < total; i++) {
                const doc = await PDFDocument.create();
                const [p] = await doc.copyPages(pdf, [i]);
                doc.addPage(p);
                const bytes = await doc.save();
                saveAs(new Blob([bytes], { type: 'application/pdf' }), `page_${i+1}.pdf`);
            }
            showToast(`✅ Split into ${total} files!`, 'success');
        } else {
            const range = document.getElementById('splitRange').value.trim();
            if (!range) { showToast('Enter page ranges.', 'error'); return; }
            const parts = range.split(',').map(s => s.trim());
            let idx = 1;
            for (const part of parts) {
                let pages = [];
                if (part.includes('-')) {
                    const [s, e] = part.split('-').map(Number);
                    for (let p = s; p <= e; p++) if (p >= 1 && p <= total) pages.push(p - 1);
                } else { const p = Number(part); if (p >= 1 && p <= total) pages.push(p - 1); }
                if (pages.length) {
                    const doc = await PDFDocument.create();
                    const copied = await doc.copyPages(pdf, pages);
                    copied.forEach(p => doc.addPage(p));
                    const bytes = await doc.save();
                    saveAs(new Blob([bytes], { type: 'application/pdf' }), `split_${idx++}.pdf`);
                }
            }
            showToast('✅ Split complete!', 'success');
        }
    } catch (err) { showToast('Error: ' + err.message, 'error'); }
}
function clearSplit() { files.split = null; document.getElementById('splitFileName').textContent = 'No file selected'; document.getElementById('splitInput').value = ''; }

// ---------- COMPRESS ----------
function handleCompressFile(e) { files.compress = e.target.files[0]; document.getElementById('compressFileName').textContent = files.compress ? files.compress.name : 'No file selected'; }
async function compressPdf() {
    if (!files.compress) { showToast('Please select a PDF.', 'error'); return; }
    const q = parseFloat(document.getElementById('compressQuality').value);
    try {
        const buf = await files.compress.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
        const total = pdf.numPages;
        const { PDFDocument } = PDFLib;
        const newPdf = await PDFDocument.create();
        for (let i = 1; i <= total; i++) {
            const page = await pdf.getPage(i);
            const vp = page.getViewport({ scale: 1.5 });
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = vp.width; canvas.height = vp.height;
            await page.render({ canvasContext: ctx, viewport: vp }).promise;
            const data = canvas.toDataURL('image/jpeg', q);
            const imgBytes = await fetch(data).then(r => r.arrayBuffer());
            const img = await newPdf.embedJpg(imgBytes);
            const p = newPdf.addPage([img.width, img.height]);
            p.drawImage(img, { x: 0, y: 0, width: img.width, height: img.height });
        }
        const bytes = await newPdf.save();
        saveAs(new Blob([bytes], { type: 'application/pdf' }), 'compressed.pdf');
        showToast('✅ PDF compressed!', 'success');
    } catch (err) { showToast('Error: ' + err.message, 'error'); }
}
function clearCompress() { files.compress = null; document.getElementById('compressFileName').textContent = 'No file selected'; document.getElementById('compressInput').value = ''; }

// ---------- PDF TO WORD ----------
function handlePdfWordFile(e) { files.pdfWord = e.target.files[0]; document.getElementById('pdfWordFileName').textContent = files.pdfWord ? files.pdfWord.name : 'No file selected'; }
async function convertPdfToWord() {
    if (!files.pdfWord) { showToast('Please select a PDF.', 'error'); return; }
    try {
        const buf = await files.pdfWord.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
        let text = '';
        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            text += content.items.map(it => it.str).join(' ') + '\n\n';
        }
        if (!text.trim()) { showToast('No text found.', 'error'); return; }
        const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'></head><body><p>${text.replace(/\n/g, '<br>')}</p></body></html>`;
        saveAs(new Blob(['\uFEFF' + html], { type: 'application/msword;charset=utf-8' }), 'converted_pdf.doc');
        document.getElementById('pdfWordPreview').innerHTML = `<div style="max-height:150px;overflow-y:auto;font-size:13px;">${text.substring(0, 800)}${text.length > 800 ? '...' : ''}</div>`;
        showToast('✅ PDF converted to Word!', 'success');
    } catch (err) { showToast('Error: ' + err.message, 'error'); }
}
function clearPdfWord() { files.pdfWord = null; document.getElementById('pdfWordFileName').textContent = 'No file selected'; document.getElementById('pdfWordInput').value = ''; document.getElementById('pdfWordPreview').innerHTML = '<p style="color:var(--text-light);">Extracted text will appear here.</p>'; }

// ---------- PDF TO PPT ----------
function handlePdfPptFile(e) { files.pdfPpt = e.target.files[0]; document.getElementById('pdfPptFileName').textContent = files.pdfPpt ? files.pdfPpt.name : 'No file selected'; }
async function convertPdfToPpt() {
    if (!files.pdfPpt) { showToast('Please select a PDF.', 'error'); return; }
    const preview = document.getElementById('pdfPptPreview');
    preview.innerHTML = '<p style="color:var(--text-light);">Rendering pages...</p>';
    try {
        const buf = await files.pdfPpt.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
        const total = pdf.numPages;
        const pptx = new PptxGenJS();
        pptx.layout = 'LAYOUT_16x9';
        for (let i = 1; i <= total; i++) {
            const page = await pdf.getPage(i);
            const vp = page.getViewport({ scale: 1.5 });
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = vp.width; canvas.height = vp.height;
            await page.render({ canvasContext: ctx, viewport: vp }).promise;
            const data = canvas.toDataURL('image/jpeg', 0.92);
            const slide = pptx.addSlide();
            const sw = pptx.width, sh = pptx.height;
            const iw = canvas.width, ih = canvas.height;
            const scale = Math.min(sw / iw, sh / ih) * 0.95;
            const w = iw * scale, h = ih * scale;
            slide.addImage({ data, x: (sw - w) / 2, y: (sh - h) / 2, w, h });
            slide.addText(`${i} / ${total}`, { x: sw - 1.0, y: sh - 0.5, w: 0.8, h: 0.4, fontSize: 10, color: '666666', align: 'right' });
            preview.innerHTML = `<p style="color:var(--text-light);">Rendering page ${i} of ${total}...</p>`;
        }
        await pptx.writeFile({ fileName: 'converted_presentation.pptx' });
        preview.innerHTML = `<p style="color:#10b981;font-weight:600;">✅ PPT created successfully! ${total} slides generated.</p>`;
        showToast('✅ PDF converted to PPTX!', 'success');
    } catch (err) { preview.innerHTML = `<p style="color:#ef4444;">❌ Error: ${err.message}</p>`; showToast('Error: ' + err.message, 'error'); }
}
function clearPdfPpt() { files.pdfPpt = null; document.getElementById('pdfPptFileName').textContent = 'No file selected'; document.getElementById('pdfPptInput').value = ''; document.getElementById('pdfPptPreview').innerHTML = '<p style="color:var(--text-light);">PDF pages will be converted to slides.</p>'; }

// ---------- PDF TO EXCEL ----------
function handlePdfExcelFile(e) { files.pdfExcel = e.target.files[0]; document.getElementById('pdfExcelFileName').textContent = files.pdfExcel ? files.pdfExcel.name : 'No file selected'; }
async function convertPdfToExcel() {
    if (!files.pdfExcel) { showToast('Please select a PDF.', 'error'); return; }
    try {
        const buf = await files.pdfExcel.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
        let allText = '';
        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            allText += content.items.map(it => it.str).join(' ') + '\n';
        }
        const rows = allText.split('\n').filter(l => l.trim());
        if (!rows.length) { showToast('No text found.', 'error'); return; }
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet(rows.map(r => [r]));
        XLSX.utils.book_append_sheet(wb, ws, 'Extracted');
        const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
        saveAs(new Blob([wbout], { type: 'application/octet-stream' }), 'pdf_extracted.xlsx');
        document.getElementById('pdfExcelPreview').innerHTML = `<div style="max-height:150px;overflow-y:auto;font-size:12px;">${rows.slice(0, 20).map(r => `<div>${r}</div>`).join('')}${rows.length > 20 ? '<div style="color:var(--text-light);">... more</div>' : ''}</div>`;
        showToast('✅ PDF converted to Excel!', 'success');
    } catch (err) { showToast('Error: ' + err.message, 'error'); }
}

async function convertPdfToJpg() {
    if (!files.pdfJpg) { showToast('Please select a PDF.', 'error'); return; }
    try {
        const buf = await files.pdfJpg.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
        const total = pdf.numPages;
        const preview = document.getElementById('pdfJpgPreview');
        preview.innerHTML = '<p style="color:var(--text-light);">Rendering...</p>';
        const images = [];
        for (let i = 1; i <= total; i++) {
            const page = await pdf.getPage(i);
            const vp = page.getViewport({ scale: 2.0 });
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

        const zip = new JSZip();
        images.forEach((url, i) => { zip.file(`page_${i+1}.jpg`, url.split(',')[1], { base64: true }); });
        const blob = await zip.generateAsync({ type: 'blob' });
        saveAs(blob, 'pdf_pages_jpg.zip');
        showToast('✅ PDF pages converted to JPG!', 'success');
    } catch (err) { showToast('Error: ' + err.message, 'error'); }

async function convertJpgToPdf() {
    if (!files.jpgPdf.length) { showToast('Please select images.', 'error'); return; }
    try {
        const { PDFDocument } = PDFLib;
        const pdf = await PDFDocument.create();
        for (const f of files.jpgPdf) {
            const buf = await f.arrayBuffer();
            let img;
            if (f.type === 'image/png') img = await pdf.embedPng(buf);

            const page = pdf.addPage([img.width, img.height]);
            page.drawImage(img, { x: 0, y: 0, width: img.width, height: img.height });
        }
        const bytes = await pdf.save();
        saveAs(new Blob([bytes], { type: 'application/pdf' }), 'converted_images.pdf');

function handleWatermarkFile(e) { files.watermark = e.target.files[0]; document.getElementById('watermarkFileName').textContent = files.watermark ? files.watermark.name : 'No file selected'; }
async function addWatermark() {
    if (!files.watermark) { showToast('Please select a PDF.', 'error'); return; }
    const text = document.getElementById('wmText').value.trim() || 'CONFIDENTIAL';
    const opacity = parseFloat(document.getElementById('wmOpacity').value);
    try {
        const { PDFDocument, rgb, StandardFonts, degrees } = PDFLib;
        const buf = await files.watermark.arrayBuffer();
        const pdf = await PDFDocument.load(buf);
        const font = await pdf.embedFont(StandardFonts.Helvetica);
        pdf.getPages().forEach(page => {
            const { width, height } = page.getSize();
            const size = 48;
            const tw = font.widthOfTextAtSize(text, size);
            const th = font.heightAtSize(size);
            page.drawText(text, {
                x: (width - tw) / 2, y: (height - th) / 2,
                size, font, color: rgb(0.5, 0.5, 0.5), opacity, rotate: degrees(45)
            });
        });
        const bytes = await pdf.save();
        saveAs(new Blob([bytes], { type: 'application/pdf' }), 'watermarked.pdf');
        showToast('✅ Watermark added!', 'success');
    } catch (err) { showToast('Error: ' + err.message, 'error'); }
}

// ---------- ORGANIZE ----------
function handleOrganizeFile(e) { files.organize = e.target.files[0]; document.getElementById('organizeFileName').textContent = files.organize ? files.organize.name : 'No file selected'; }
async function organizePdf() {
    if (!files.organize) { showToast('Please select a PDF.', 'error'); return; }
    const orderStr = document.getElementById('organizeOrder').value.trim();
    if (!orderStr) { showToast('Enter new page order.', 'error'); return; }
    try {
        const { PDFDocument } = PDFLib;
        const buf = await files.organize.arrayBuffer();
        const pdf = await PDFDocument.load(buf);
        const total = pdf.getPageCount();
        const order = orderStr.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n) && n >= 1 && n <= total).map(n => n - 1);
        if (order.length !== total) { showToast(`Enter ${total} page numbers.`, 'error'); return; }
        const newPdf = await PDFDocument.create();
        const copied = await newPdf.copyPages(pdf, order);
        copied.forEach(p => newPdf.addPage(p));
        const bytes = await newPdf.save();
        saveAs(new Blob([bytes], { type: 'application/pdf' }), 'organized.pdf');
        showToast('✅ Pages reordered!', 'success');
    } catch (err) { showToast('Error: ' + err.message, 'error'); }
}

function handlePageNumFile(e) { files.pageNum = e.target.files[0]; document.getElementById('pageNumFileName').textContent = files.pageNum ? files.pageNum.name : 'No file selected'; }
async function addPageNumbers() {
    if (!files.pageNum) { showToast('Please select a PDF.', 'error'); return; }
    const pos = document.getElementById('pageNumPosition').value;
    const start = parseInt(document.getElementById('pageNumStart').value) || 1;
    try {
        const { PDFDocument, rgb, StandardFonts } = PDFLib;
        const buf = await files.pageNum.arrayBuffer();
        const pdf = await PDFDocument.load(buf);
        const font = await pdf.embedFont(StandardFonts.Helvetica);
        pdf.getPages().forEach((page, i) => {
            const { width, height } = page.getSize();
            const text = String(start + i);
            const size = 12;
            const tw = font.widthOfTextAtSize(text, size);
            let x, y;
            if (pos === 'bottom-center') { x = (width - tw) / 2; y = 30; }
            else if (pos === 'bottom-right') { x = width - tw - 30; y = 30; }
            else if (pos === 'bottom-left') { x = 30; y = 30; }
            else if (pos === 'top-center') { x = (width - tw) / 2; y = height - 30; }
            else if (pos === 'top-right') { x = width - tw - 30; y = height - 30; }
            else { x = 30; y = height - 30; }
            page.drawText(text, { x, y, size, font, color: rgb(0, 0, 0) });
        });
        const bytes = await pdf.save();
        saveAs(new Blob([bytes], { type: 'application/pdf' }), 'with_page_numbers.pdf');
        showToast('✅ Page numbers added!', 'success');
    } catch (err) { showToast('Error: ' + err.message, 'error'); }
}

// ---------- OCR ----------
function handleOcrFile(e) { files.ocr = e.target.files[0]; document.getElementById('ocrFileName').textContent = files.ocr ? files.ocr.name : 'No file selected'; }
async function runOcr() {
    if (!files.ocr) { showToast('Please select a PDF.', 'error'); return; }
    const bar = document.getElementById('ocrProgressBar');
    const fill = document.getElementById('ocrProgressFill');
    const status = document.getElementById('ocrStatusText');
    const resultArea = document.getElementById('ocrResultArea');
    const resultText = document.getElementById('ocrResultText');
    resultArea.style.display = 'none';
    resultText.value = '';
    bar.style.display = 'block';
    fill.style.width = '0%';
    status.classList.add('show');
    status.innerHTML = '<i class="fas fa-spinner spinner"></i> Processing OCR...';
    try {
        const buf = await files.ocr.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
        const total = pdf.numPages;
        let fullText = '';
        for (let i = 1; i <= total; i++) {
            const page = await pdf.getPage(i);
            const vp = page.getViewport({ scale: 2.0 });
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = vp.width; canvas.height = vp.height;
            await page.render({ canvasContext: ctx, viewport: vp }).promise;
            const imgData = canvas.toDataURL('image/png');
            const { data: { text } } = await Tesseract.recognize(imgData, 'hin+eng');
            fullText += `\n--- Page ${i} ---\n${text}\n`;
            fill.style.width = Math.round((i / total) * 100) + '%';
            status.innerHTML = `<i class="fas fa-spinner spinner"></i> Page ${i} of ${total}...`;
        }
        resultText.value = fullText.trim();
        fill.style.width = '100%';
        setTimeout(() => {
            bar.style.display = 'none';
            status.classList.remove('show');
            resultArea.style.display = 'block';
            showToast('✅ OCR completed!', 'success');
        }, 500);
    } catch (err) {
        status.innerHTML = '❌ Error: ' + err.message;
        status.style.color = '#ef4444';
        setTimeout(() => { status.classList.remove('show'); bar.style.display = 'none'; status.style.color = ''; }, 3000);
        showToast('Error: ' + err.message, 'error');
    }
}
function copyOcrResult() { const t = document.getElementById('ocrResultText'); if (!t.value) return showToast('Nothing to copy!', 'error'); t.select(); navigator.clipboard.writeText(t.value).then(() => showToast('✅ Copied!', 'success')); }

function clearOcr() { files.ocr = null; document.getElementById('ocrFileName').textContent = 'No file selected'; document.getElementById('ocrInput').value = ''; document.getElementById('ocrResultArea').style.display = 'none'; document.getElementById('ocrResultText').value = ''; document.getElementById('ocrProgressBar').style.display = 'none'; document.getElementById('ocrStatusText').classList.remove('show'); }

function handleCompare1(e) { files.compare1 = e.target.files[0]; document.getElementById('compare1FileName').textContent = files.compare1 ? files.compare1.name : 'No file selected'; }
function handleCompare2(e) { files.compare2 = e.target.files[0]; document.getElementById('compare2FileName').textContent = files.compare2 ? files.compare2.name : 'No file selected'; }
async function comparePdfs() {
    if (!files.compare1 || !files.compare2) { showToast('Please select both PDFs.', 'error'); return; }
    try {
        const [b1, b2] = await Promise.all([files.compare1.arrayBuffer(), files.compare2.arrayBuffer()]);
        const [p1, p2] = await Promise.all([pdfjsLib.getDocument({ data: b1 }).promise, pdfjsLib.getDocument({ data: b2 }).promise]);
        const [c1, c2] = await Promise.all([p1.getPage(1), p2.getPage(1)]);
        const [t1, t2] = await Promise.all([c1.getTextContent(), c2.getTextContent()]);
        const s1 = t1.items.map(i => i.str).join(' ');
        const s2 = t2.items.map(i => i.str).join(' ');
        const diff = s1 === s2 ? 'No differences detected on first page.' : 'Differences detected on first page.';
        showToast(diff, 'info');
    } catch (err) { showToast('Error: ' + err.message, 'error'); }
}

function handleMarkdownFile(e) { files.markdown = e.target.files[0]; document.getElementById('markdownFileName').textContent = files.markdown ? files.markdown.name : 'No file selected'; }
async function convertToMarkdown() {
    if (!files.markdown) { showToast('Please select a PDF.', 'error'); return; }
    try {
        const buf = await files.markdown.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
        let md = '';
        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            const lines = content.items.map(it => it.str).join('\n');
            md += lines + '\n\n';
        }
        if (!md.trim()) { showToast('No text found.', 'error'); return; }
        document.getElementById('markdownPreview').innerHTML = `<pre style="white-space:pre-wrap;font-size:13px;max-height:250px;overflow-y:auto;">${md.substring(0, 3000)}${md.length > 3000 ? '...' : ''}</pre>`;
        const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
        saveAs(blob, 'converted.md');
        showToast('✅ Markdown file created!', 'success');
    } catch (err) { showToast('Error: ' + err.message, 'error'); }
}
function clearMarkdown() { files.markdown = null; document.getElementById('markdownFileName').textContent = 'No file selected'; document.getElementById('markdownInput').value = ''; document.getElementById('markdownPreview').innerHTML = '<p style="color:var(--text-light);">Extracted Markdown will appear here.</p>'; }
